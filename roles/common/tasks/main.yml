---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install software-properties-common (provides add-apt-repository)
  apt:
    name: software-properties-common
    state: present

- name: Enable Ubuntu Universe repository
  command: add-apt-repository -y universe
  register: universe_result
  changed_when: "'already enabled' not in (universe_result.stdout + universe_result.stderr)"

- name: Update apt cache after repository changes
  apt:
    update_cache: yes
  when: universe_result is changed

- name: Install common utility packages
  apt:
    name: "{{ common_packages }}"
    state: present
  register: common_install
  until: common_install is succeeded
  retries: 3
  delay: 5

- name: Ensure keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
